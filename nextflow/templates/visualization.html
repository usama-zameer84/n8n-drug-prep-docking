<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Docking poses — $ligand_name</title>
  <style>
    body { color: #1d2733; font-family: system-ui, sans-serif; margin: 2rem; }
    .viewer-shell { background: #f4f7fa; border: 1px solid #ccd5df; border-radius: 8px; max-width: 1100px; overflow: hidden; }
    canvas { cursor: grab; display: block; height: 520px; touch-action: none; width: 100%; }
    canvas:active { cursor: grabbing; }
    .viewer-controls { align-items: center; display: flex; flex-wrap: wrap; gap: .75rem; padding: .65rem .8rem; }
    button { background: #fff; border: 1px solid #8796a5; border-radius: 4px; cursor: pointer; padding: .4rem .7rem; }
    table { border-collapse: collapse; margin-top: 1.25rem; }
    th, td { border: 1px solid #ccd5df; padding: 4px 8px; }
    .legend { color: #465666; font-size: .9rem; }
  </style>
</head>
<body>
  <h1>Docking poses (top modes)</h1>
  <div class="viewer-shell">
    <canvas id="viewer" role="img" aria-label="Interactive three-dimensional view of the prepared receptor and selected ligand pose">
      This browser does not support the molecular viewer.
    </canvas>
    <div class="viewer-controls">
      <button id="reset-view" type="button">Reset view</button>
      <span id="viewer-status" role="status">Loading structure…</span>
      <span class="legend">Drag to rotate · scroll to zoom · receptor backbone in blue · ligand atoms by element</span>
    </div>
  </div>
  <table><thead><tr><th>Replica</th><th>Rank</th><th>Affinity (kcal/mol)</th><th>RMSD l.b. (Å)</th><th>RMSD u.b. (Å)</th></tr></thead><tbody>$pose_rows</tbody></table>
  <script>
    (() => {
      const receptorAtoms = $receptor_atoms;
      const ligandAtoms = $ligand_atoms;
      const canvas = document.getElementById('viewer');
      const context = canvas.getContext('2d');
      const status = document.getElementById('viewer-status');
      const colors = {C: '#30353b', N: '#2457d6', O: '#d62f2f', S: '#d49b12', P: '#de7f20', H: '#d9dde1'};
      let rotationX = -0.35;
      let rotationY = 0.55;
      let zoom = 1;
      let dragging = false;
      let lastX = 0;
      let lastY = 0;

      const allAtoms = receptorAtoms.concat(ligandAtoms);
      const center = allAtoms.reduce((sum, atom) => ({x: sum.x + atom.x, y: sum.y + atom.y, z: sum.z + atom.z}), {x: 0, y: 0, z: 0});
      center.x /= allAtoms.length;
      center.y /= allAtoms.length;
      center.z /= allAtoms.length;
      const centered = atoms => atoms.map(atom => ({...atom, x: atom.x - center.x, y: atom.y - center.y, z: atom.z - center.z}));
      const receptor = centered(receptorAtoms);
      const ligand = centered(ligandAtoms);

      function rotate(atom) {
        const cosY = Math.cos(rotationY);
        const sinY = Math.sin(rotationY);
        const x1 = atom.x * cosY - atom.z * sinY;
        const z1 = atom.x * sinY + atom.z * cosY;
        const cosX = Math.cos(rotationX);
        const sinX = Math.sin(rotationX);
        return {...atom, x: x1, y: atom.y * cosX - z1 * sinX, z: atom.y * sinX + z1 * cosX};
      }

      function resize() {
        const ratio = window.devicePixelRatio || 1;
        const bounds = canvas.getBoundingClientRect();
        canvas.width = Math.max(1, Math.round(bounds.width * ratio));
        canvas.height = Math.max(1, Math.round(bounds.height * ratio));
        context.setTransform(ratio, 0, 0, ratio, 0, 0);
      }

      function draw() {
        resize();
        const width = canvas.clientWidth;
        const height = canvas.clientHeight;
        context.clearRect(0, 0, width, height);
        context.fillStyle = '#f4f7fa';
        context.fillRect(0, 0, width, height);
        const rotatedReceptor = receptor.map(rotate);
        const rotatedLigand = ligand.map(rotate);
        const extent = Math.max(...allAtoms.map(atom => Math.hypot(atom.x - center.x, atom.y - center.y, atom.z - center.z)), 1);
        const scale = Math.min(width, height) * 0.42 * zoom / extent;
        const project = atom => ({...atom, sx: width / 2 + atom.x * scale, sy: height / 2 - atom.y * scale});
        const receptorPoints = rotatedReceptor.map(project);
        const ligandPoints = rotatedLigand.map(project);

        context.strokeStyle = 'rgba(55, 112, 169, .55)';
        context.lineWidth = 1.4;
        for (let index = 1; index < receptorPoints.length; index += 1) {
          const previous = receptorPoints[index - 1];
          const current = receptorPoints[index];
          const distance = Math.hypot(current.x - previous.x, current.y - previous.y, current.z - previous.z);
          if (current.chain !== previous.chain || distance > 4.5) continue;
          context.beginPath();
          context.moveTo(previous.sx, previous.sy);
          context.lineTo(current.sx, current.sy);
          context.stroke();
        }

        for (let first = 0; first < ligandPoints.length; first += 1) {
          for (let second = first + 1; second < ligandPoints.length; second += 1) {
            const a = ligandPoints[first];
            const b = ligandPoints[second];
            const distance = Math.hypot(a.x - b.x, a.y - b.y, a.z - b.z);
            if (distance > 1.9) continue;
            context.strokeStyle = '#69737d';
            context.lineWidth = 2.5;
            context.beginPath();
            context.moveTo(a.sx, a.sy);
            context.lineTo(b.sx, b.sy);
            context.stroke();
          }
        }

        receptorPoints.sort((a, b) => a.z - b.z).forEach(atom => {
          context.fillStyle = 'rgba(55, 112, 169, .65)';
          context.beginPath();
          context.arc(atom.sx, atom.sy, 2.2, 0, Math.PI * 2);
          context.fill();
        });
        ligandPoints.sort((a, b) => a.z - b.z).forEach(atom => {
          context.fillStyle = colors[atom.element] || '#9a55b5';
          context.strokeStyle = '#fff';
          context.lineWidth = 1;
          context.beginPath();
          context.arc(atom.sx, atom.sy, atom.element === 'H' ? 4 : 6, 0, Math.PI * 2);
          context.fill();
          context.stroke();
        });
        canvas.dataset.viewerReady = 'true';
        status.textContent = `$${receptorAtoms.length} receptor backbone atoms and $${ligandAtoms.length} ligand atoms loaded`;
      }

      canvas.addEventListener('pointerdown', event => {
        dragging = true;
        lastX = event.clientX;
        lastY = event.clientY;
        canvas.setPointerCapture(event.pointerId);
      });
      canvas.addEventListener('pointermove', event => {
        if (!dragging) return;
        rotationY += (event.clientX - lastX) * 0.01;
        rotationX += (event.clientY - lastY) * 0.01;
        lastX = event.clientX;
        lastY = event.clientY;
        draw();
      });
      canvas.addEventListener('pointerup', () => { dragging = false; });
      canvas.addEventListener('wheel', event => {
        event.preventDefault();
        zoom = Math.min(4, Math.max(0.35, zoom * (event.deltaY > 0 ? 0.9 : 1.1)));
        draw();
      }, {passive: false});
      document.getElementById('reset-view').addEventListener('click', () => {
        rotationX = -0.35;
        rotationY = 0.55;
        zoom = 1;
        draw();
      });
      window.addEventListener('resize', draw);
      draw();
    })();
  </script>
</body>
</html>
